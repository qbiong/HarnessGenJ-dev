[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harnessgenj-dev"
version = "0.1.0-dev"
description = "HarnessGenJ 独立开发工具 - AI 驱动的多角色开发助手"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    # 核心依赖 (继承 HGJ)
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",

    # HTTP / LLM
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",

    # 终端 UI
    "textual>=0.50.0",
    "rich>=13.0.0",

    # AST 分析
    "tree-sitter>=0.22.0",
    # tree-sitter-languages 暂时注释：不支持 Python 3.13
    # "tree-sitter-languages>=1.10.0",

    # 工具
    "pyyaml>=6.0",
    "tiktoken>=0.7.0",
    "watchdog>=4.0.0",

    # MCP (Model Context Protocol)
    "mcp>=1.0.0",

    # Web Dashboard (Phase 3)
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
local-llm = [
    "ollama>=0.2.0",
]

[project.scripts]
hgj-dev = "harnessgenj_dev.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harnessgenj_dev"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
exclude = ["src/harnessgenj_dev/web/dashboard.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests requiring real API keys (slow)",
    "anthropic: requires ANTHROPIC_API_KEY environment variable",
    "openai: requires OPENAI_API_KEY environment variable",
    "slow: tests that take longer to run (network calls, etc.)",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
